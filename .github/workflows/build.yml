name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Only a tag build can send data. A manual build has no key.
  POSTHOG_API_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.POSTHOG_API_KEY || '' }}

jobs:
  linux:
    name: Linux (deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test packages
        # CoCAD needs an OpenSCAD build with the Manifold backend. Ubuntu has
        # only 2021.01, so the tests use openscad-nightly from the OpenSCAD
        # repository on download.opensuse.org.
        run: |
          repo=https://download.opensuse.org/repositories/home:/t-paul/xUbuntu_24.04
          curl -fsSL "$repo/Release.key" | gpg --dearmor | sudo tee /usr/share/keyrings/openscad-nightly.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/openscad-nightly.gpg] $repo/ ./" | sudo tee /etc/apt/sources.list.d/openscad-nightly.list
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl-dev fakeroot openscad-nightly
          openscad-nightly --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Test models (render, export, slice)
        run: scripts/test-models.sh --release
      - name: Package
        run: |
          scripts/package-deb.sh --no-build
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist/tar/cocad-$version-linux-x86_64
          cp target/release/cocad README.md LICENSE dist/tar/cocad-$version-linux-x86_64/
          tar -C dist/tar -czf dist/cocad-$version-linux-x86_64.tar.gz cocad-$version-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    name: macOS (universal app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The update notice of the app lists the bullets of the release notes.
      # GitHub lists only pull requests, and most changes go directly to main.
      - name: Write release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='* %s' "${prev:+$prev..}$GITHUB_REF_NAME" \
            | { grep -vE '^\* (Version |Website: )' || true; } > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
