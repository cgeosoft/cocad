[package]
name = "cocad"
version = "0.7.0"
edition = "2024"
description = "OpenSCAD model viewer with Customizer parameters, STL/3MF/STEP export, slice preview and photo renders"
authors = ["Christos Georgiou <christos@cgeosoft.com>"]
license = "MIT"
repository = "https://github.com/cgeosoft/cocad"
readme = "README.md"
keywords = ["openscad", "3d-printing", "cad", "viewer", "slicer"]
categories = ["graphics", "visualization"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "persistence"] }
getrandom = "0.3"
glam = "0.29"
png = "0.17"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
zune-core = "0.5"
zune-jpeg = "0.5"

# Linux uses rustls, so the package needs no OpenSSL. Windows and macOS use the
# TLS of the system, so `cargo check` for them works from Linux.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
