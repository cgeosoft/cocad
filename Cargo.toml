[package]
name = "scad-viewer"
version = "0.1.6"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "persistence"] }
glam = "0.29"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
