[package]
name = "scad-viewer"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = "1.25.2"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
glam = "0.29"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
